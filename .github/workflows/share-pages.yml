name: Páginas para compartir de la agencia
# Cada vez que cambia el stock (agencia/index.html) regenera agencia/v/<id>.html,
# así ningún link de auto para compartir da error 404.
on:
  push:
    branches: [main, master]
    paths:
      - 'agencia/index.html'
      - 'tools/share_pages.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/share_pages.py
      - name: Subir cambios
        run: |
          git config user.name "share-pages-bot"
          git config user.email "share-pages-bot@users.noreply.github.com"
          git add agencia/v
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Agencia: regenera páginas para compartir (automático)" && git push; fi
