<script>
// Si piden la página para compartir de un auto que todavía no se generó,
// mandamos directo a la ficha del auto en vez de mostrar un error.
(function(){
  var m=location.pathname.match(/\/agencia\/v\/(\d+)(\.html)?\/?$/);

  if(/^\/agencia\//.test(location.pathname)){location.replace("/agencia/");}
})();
</script>
