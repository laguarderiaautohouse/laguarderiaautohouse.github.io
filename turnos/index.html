    h+='<button type="button" class="link" id="otro">Prefiero otro día</button>'}
  else if(s==="dia"){h=`<h1>Qué <span>día</span>?</h1><div class="opts">${S.list.map(v=>`<button type="button" class="opt" data-d="${v}"><span>${dayLabel(v)}</span></button>`).join("")}</div>`}
  else if(s==="auto"&&S.cli&&S.cli.autos.length&&!S.otro){h=`<h1>Qué <span>auto</span> traés?</h1><div class="opts">${S.cli.autos.map((a,i)=>`<button type="button" class="opt" data-c="${i}"><span>${esc(a.auto)}<small>${esc(a.pat)}</small></span><b>${money(TIPOS[guess(a.auto)][2])}</b></button>`).join("")}<button type="button" class="opt" data-c="otro"><span>Otro auto</span></button></div>`}
  else if(PANT[s]){const c=PANT[s];h=`<h1>${c.t}</h1><form id="f" class="ff" novalidate>${c.f.map(k=>`<label>${CAMPOS[k].l}<input class="t" id="i_${k}" ${CAMPOS[k].attr} placeholder="${CAMPOS[k].ph}" value="${esc(S.v[k])}"></label>`).join("")}<p class="hint" id="hint"></p><p class="err" id="err" role="alert"></p><button class="cta" type="submit">Seguir</button></form>`}
  else if(s==="tipo"){const g=guess(S.v.auto);h=`<h1>Es este <span>tamaño</span>?</h1><div class="opts">${TIPOS.map(([n,,p],i)=>`<button type="button" class="opt${i===g?" sug":""}" data-i="${i}"><span>${n}${i===g?"<small>Lo elegimos por tu modelo</small>":""}</span><b>${money(p)}</b></button>`).join("")}</div>`}
  else if(s==="pago"){h=`<h1>Cómo <span>pagás</span>?</h1><div class="opts"><button type="button" class="opt" data-p="local"><span>En el local<small>Cuando traés el auto</small></span></button><button type="button" class="opt" data-p="mp"><span>Ahora con Mercado Pago<small>${money(TIPOS[S.tipo][2])}</small></span></button></div>`}
  else if(s==="fin"){h=`<h1>Todo <span>listo</span></h1><div class="sumc"><b>${dayLabel(S.day)} · ${S.slot}</b>${esc(S.v.auto)} · ${esc(S.car?S.car.pat:patente())}<br>${TIPOS[S.tipo][1]}<br>Pago: ${S.pago==="mp"?"ahora con Mercado Pago":"en el local"}<div class="tot"><span>Total</span><b id="tot">${money(total())}</b></div></div><p class="kick">Sumale a tu lavado</p><div class="opts">${ADIC.map(([n,pr],i)=>`<button type="button" class="opt add${S.ad.has(i)?" ok":""}" data-a="${i}" aria-pressed="${S.ad.has(i)}"><span>${n}</span><b${pr?' class="p"':""}>${pr?"+"+money(pr):(ADIC[i][2]?ADIC[i][2]():"se cotiza en el local")}</b></button>`).join("")}</div><p class="err" id="err" role="alert"></p><button class="cta g" id="agendar" type="button">Agendar</button><p class="fine">Al agendar aceptás que usemos tus datos para el turno y para avisarte por WhatsApp.</p>`}
  st.innerHTML=h;S.note="";st.style.animation="none";void st.offsetWidth;st.style.animation="";
  const inp=document.querySelector("#stage input.t");if(inp)setTimeout(()=>inp.focus({preventScroll:true}),320);
  let t="Hola, quiero un turno de lavado.";const n=S.v.nom.trim(),a=S.v.auto.trim();
  if(n||a)t=`Hola${n?", soy "+n:""}. Quiero un turno de lavado${a?" para mi "+a:""}${S.tipo!==null?" ("+TIPOS[S.tipo][1]+", "+money(TIPOS[S.tipo][2])+")":""}.`;
  $("mWa").href="https://wa.me/"+WA+"?text="+encodeURIComponent(t)}
const patente=()=>S.v.pat.toUpperCase().replace(/[\s-]/g,"");

$("stage").addEventListener("click",e=>{if(S.busy)return;const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.id==="otro"){go("dia");return}
  if(b.dataset.c==="otro"){S.otro=true;S.car=null;S.v.auto="";S.v.pat="";go("auto");return}
  if(b.dataset.c){S.car=S.cli.autos[Number(b.dataset.c)];S.v.auto=S.car.auto;S.tipo=guess(S.car.auto);b.classList.add("ok");cheer("pago",`${TIPOS[S.tipo][1]} · ${money(TIPOS[S.tipo][2])}`);return}
  if(b.id==="agendar"){agendar(b);return}
  if(b.dataset.a){const i=Number(b.dataset.a);S.ad.has(i)?S.ad.delete(i):S.ad.add(i);b.classList.toggle("ok",S.ad.has(i));b.setAttribute("aria-pressed",S.ad.has(i));$("tot").textContent=money(total());return}
  if(b.dataset.h){S.slot=b.dataset.h;b.classList.add("ok");cheer("vos")}
  else if(b.dataset.d){S.day=b.dataset.d;S.autoDay=false;S.slot=null;b.classList.add("ok");loadSlots(S.day);cheer("hora")}
  else if(b.dataset.i){S.tipo=Number(b.dataset.i);b.classList.remove("sug");b.classList.add("ok");cheer("pat")}
  else if(b.dataset.p){S.pago=b.dataset.p;b.classList.add("ok");cheer("fin")}});
$("stage").addEventListener("submit",e=>{e.preventDefault();if(S.busy)return;const ks=PANT[S.step];if(!ks)return;
  for(const k of ks.f){const el=$("i_"+k);if(!CAMPOS[k].ok(el.value)){$("err").textContent=CAMPOS[k].err;el.focus();return}}
  for(const k of ks.f){const el=$("i_"+k);S.v[k]=el.value.trim();el.classList.add("ok");el.blur()}
  if(S.step==="auto"){S.car=null;S.tipo=guess(S.v.auto);cheer("pago",`${TIPOS[S.tipo][1]} · ${money(TIPOS[S.tipo][2])}`)}
  else{if(S.cli&&S.cli.tel!==S.v.tel.replace(/\D/g,"").slice(-10))S.cli=null;S.otro=false;cheer("auto",S.cli?"Qué bueno verte de nuevo":"")}});
$("stage").addEventListener("input",async e=>{const er=$("err");if(er)er.textContent="";
  /* Al completar la patente, si ya vino antes se carga solo el modelo. */
  if(e.target.id==="i_tel"){const t=e.target.value.replace(/\D/g,""),n=$("i_nom");if(t.length>=10){const c=await buscarCliente(t);if($("i_tel")!==e.target)return;
      if(c){c.tel=t.slice(-10);S.cli=c;const pn=(c.nombre||"").trim(),full=pn.split(/\s+/).length>=2;if(!n.value||n.dataset.auto){n.value=pn;n.dataset.auto="1";n.classList.toggle("ok",full)}$("hint").textContent="Ya te conocemos"+(pn?", "+pn.split(" ")[0]:"")+(full?"":". Completá tu nombre y apellido")}
      else if(n.dataset.auto){S.cli=null;n.value="";delete n.dataset.auto;n.classList.remove("ok");$("hint").textContent=""}}}
  else if(e.target.id==="i_nom"){delete e.target.dataset.auto;e.target.classList.remove("ok")}});
$("back").addEventListener("click",()=>{if(S.busy)return;const s=S.step;if(s==="auto"&&S.otro&&S.cli){S.otro=false;render();return}const P=path();go(s==="dia"?"hora":P[Math.max(0,P.indexOf(s)-1)])});

async function agendar(b){b.disabled=true;b.textContent="Reservando…";
  const adic=[...S.ad].sort().map(i=>ADIC[i][0]);
  const data={servicio:TIPOS[S.tipo][1]+adic.map(n=>" + "+n.toLowerCase()).join(""),precio:total(),base:TIPOS[S.tipo][2],adic,fecha:S.day,hora:S.slot,nombre:S.v.nom,telefono:S.v.tel.replace(/\D/g,""),auto:S.v.auto,patente:S.car?"":patente(),autoId:S.car?S.car.id:"",clienteConocido:!!S.cli,pago:S.pago==="mp"?"Mercado Pago online":"En el local",conocido:S.skipNom,web:$("web").value};
  const fail=m=>{b.disabled=false;b.textContent="Agendar";$("err").textContent=m};
  try{if(API){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)});const j=await r.json();
      if(!j.ok){if(j.error==="espera"){fail("Ya sacaste un turno recién. Si necesitás otro, esperá unos minutos o pedile ayuda al asesor.");return}if(j.error==="ocupado"){S.slot=null;S.note="Justo se ocupó ese horario. Elegí otro.";loadSlots(S.day);go("hora")}else fail("No pudimos guardar el turno. Probá de nuevo o pedile ayuda al asesor.");return}}
    party(data)}catch(err){fail("No pudimos guardar el turno. Probá de nuevo o pedile ayuda al asesor.")}}
function party(d){const p=$("party");const cols=["#ffffff","#0d7a3a","#c6a35a","#0a0a0a"];let conf="";for(let i=0;i<40;i++)conf+=`<i class="conf" style="left:${Math.random()*100}%;background:${cols[i%4]};animation-duration:${1.6+Math.random()*1.6}s;animation-delay:${Math.random()*.6}s"></i>`;
  let first=true;const base=d.base;const draw=()=>{const link=PAGOS[base];let pay="";
  if(S.pago==="mp")pay=link?`<a class="pay" href="${link}" target="_blank" rel="noopener">Pagar ${money(base)}</a>${d.adic.length?`<p class="addr">Los adicionales se pagan en el local.</p>`:""}`:`<p>El pago online todavía no está conectado: se paga en el local.</p>`;
  p.innerHTML=`<div class="party${first?"":" still"}" role="status">${conf}<div class="tick">✓</div><h3>Turno confirmado!</h3><div class="card"><b>${fmtDay(d.fecha)} · ${d.hora}</b>${esc(d.auto)} ${esc(S.car?S.car.pat:d.patente)} · ${money(d.precio)}</div>${pay}${d.adic.length?`<p class="addr">Con ${esc(d.adic.join(", ").toLowerCase())}</p>`:""}<a class="pay go" href="${MAPS}" target="_blank" rel="noopener">Ir</a><p class="addr">Hipólito Yrigoyen 3756, Mar del Plata</p><button type="button" id="again">Listo</button></div>`;p.hidden=false;first=false;
  const m=$("motor");if(m)m.onclick=async()=>{m.disabled=true;m.textContent="Agregando…";const nd={...d,precio:d.precio+MOTOR,servicio:d.servicio+" + lavado de motor",accion:"adicional"};let ok=true;
    if(API){try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(nd)});const j=await r.json();ok=!!j.ok}catch(e){ok=false}}
    if(ok){d.motor=true;d.precio=nd.precio;d.servicio=nd.servicio;conf="";draw()}else{m.disabled=false;m.textContent="No se pudo agregar. Tocá para reintentar"}};
  $("again").onclick=()=>{p.hidden=true;S.ad.clear();S.cli=null;S.car=null;S.otro=false;Object.assign(S,{slot:null,tipo:null,pago:null,autoDay:true,known:false,skipNom:false,v:{tel:"",nom:"",auto:"",pat:""}});S.day=S.list[0];loadSlots(S.day);go("hora")}};draw()}
buildDays();S.day=S.list[0];render();loadSlots(S.day);
</script>

</body></html>
